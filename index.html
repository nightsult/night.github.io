<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nightimagens - Hospedagem Rápida de Imagens</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col selection:bg-indigo-500 selection:text-white">

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <script>
        // --- STORAGE & MOCK DATA ---
        const STORAGE_KEY = 'nightimagens_db_v1';
        
        const defaultImages = [
            {
                id: 'n8x9q2',
                url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop',
                name: 'Abstrato Cósmico Neon',
                size: '1.4 MB',
                uploadedAt: new Date(Date.now() - 3600000 * 2).toISOString()
            },
            {
                id: 'k3m9p1',
                url: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=1920&auto=format&fit=crop',
                name: 'Arte Abstrata Texturizada',
                size: '2.1 MB',
                uploadedAt: new Date(Date.now() - 3600000 * 24).toISOString()
            },
            {
                id: 'z7v2w8',
                url: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1920&auto=format&fit=crop',
                name: 'Cyberpunk Neon Estilo',
                size: '1.8 MB',
                uploadedAt: new Date(Date.now() - 3600000 * 48).toISOString()
            }
        ];

        function inferImageExtension(url) {
            if (!url) return 'png';

            if (url.startsWith('data:image/')) {
                const mime = (url.match(/^data:(image\/[a-zA-Z0-9.+-]+);/i) || [])[1] || '';
                if (mime.includes('jpeg')) return 'jpg';
                if (mime.includes('svg')) return 'svg';
                if (mime.includes('webp')) return 'webp';
                if (mime.includes('gif')) return 'gif';
                if (mime.includes('png')) return 'png';
                return 'png';
            }

            try {
                const pathname = new URL(url, window.location.origin).pathname;
                const ext = (pathname.match(/\.([a-zA-Z0-9]{2,5})$/) || [])[1];
                if (ext) return ext.toLowerCase();
            } catch (e) {}

            return 'png';
        }

        function buildDirectImageUrl(img) {
            if (img.url && img.url.startsWith('data:image/')) {
                return `${window.location.origin}/#/${img.id}`;
            }
            const ext = inferImageExtension(img.url);
            return `${window.location.origin}/api/image/${img.id}.${ext}?src=${encodeURIComponent(img.url)}`;
        }

        function getImages() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (!data) {
                    const seeded = defaultImages.map(img => ({ ...img, directUrl: buildDirectImageUrl(img) }));
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
                    return seeded;
                }
                return JSON.parse(data).map(img => ({
                    ...img,
                    directUrl: buildDirectImageUrl(img)
                }));
            } catch (e) {
                return defaultImages.map(img => ({ ...img, directUrl: buildDirectImageUrl(img) }));
            }
        }

        function saveImages(images) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
        }

        function generateId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let res = '';
            for (let i = 0; i < 6; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        // --- CUSTOM TOAST / MODAL SYSTEM ---
        function showNotification(message, type = 'success') {
            const existing = document.getElementById('toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            toast.className = `fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium border backdrop-blur-md transition-all transform translate-y-2 opacity-0 animate-fade-in ${
                type === 'success' 
                    ? 'bg-emerald-950/80 border-emerald-500/30 text-emerald-200' 
                    : 'bg-rose-950/80 border-rose-500/30 text-rose-200'
            }`;
            
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-5 h-5 flex-shrink-0"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- ROUTING CORE ---
        function handleRoute() {
            const path = window.location.pathname;
            const hash = window.location.hash;
            
            // Check if URL matches /<id> (e.g. /n8x9q2 or hash #/n8x9q2 for SPA simulation)
            const cleanPath = path === '/' ? (hash.startsWith('#/') ? hash.replace('#/', '') : '') : path.replace('/', '');
            
            if (cleanPath && cleanPath !== 'admin' && cleanPath !== '') {
                renderDirectImageView(cleanPath);
            } else if (cleanPath === 'admin' || hash === '#/admin') {
                renderAdminView();
            } else {
                renderHomeView();
            }
        }

        window.addEventListener('popstate', handleRoute);
        window.addEventListener('hashchange', handleRoute);

        // --- VIEW 1: DIRECT IMAGE VIEW (<site>/<id>) ---
        function renderDirectImageView(id) {
            const images = getImages();
            const img = images.find(item => item.id === id);
            
            const app = document.getElementById('app');
            if (!img) {
                app.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center bg-slate-950">
                        <div class="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 mb-4">
                            <i data-lucide="image-off" class="w-8 h-8"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-slate-100 mb-2">Imagem não encontrada</h1>
                        <p class="text-slate-400 max-w-md mb-6">A imagem solicitada com ID <code class="bg-slate-900 px-2 py-1 rounded text-rose-300 font-mono">${id}</code> não existe ou foi removida.</p>
                        <a href="#/" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center gap-2">
                            <i data-lucide="home" class="w-4 h-4"></i> Voltar ao Início
                        </a>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // EXACT REQUIREMENT: "a imagem deve abrir SÓ a imagem e mais nada! e a qualidade precisa ser boa e o tempo de reposta mega rapido"
            app.innerHTML = `
                <div class="fixed inset-0 bg-black flex items-center justify-center overflow-hidden m-0 p-0">
                    <img src="${img.url}" alt="${img.name}" class="max-w-full max-h-full object-contain select-none cursor-zoom-in transition-transform duration-300" id="raw-img" onclick="toggleZoom()" />
                    <div class="absolute bottom-4 right-4 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/10 text-xs text-white/70 flex items-center gap-3 pointer-events-none">
                        <span>nightimagens/${img.id}</span>
                        <span>•</span>
                        <span>Alta Qualidade</span>
                    </div>
                </div>
            `;
            
            // Zoom toggle helper
            window.toggleZoom = function() {
                const el = document.getElementById('raw-img');
                if (el.classList.contains('scale-150')) {
                    el.classList.remove('scale-150', 'cursor-zoom-out');
                    el.classList.add('cursor-zoom-in');
                } else {
                    el.classList.add('scale-150', 'cursor-zoom-out');
                    el.classList.remove('cursor-zoom-in');
                }
            };
            lucide.createIcons();
        }

        // --- VIEW 2: HOME / RECENT IMAGES GALLERY ---
        function renderHomeView() {
            const images = getImages();
            const app = document.getElementById('app');

            app.innerHTML = `
                <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <a href="#/" class="flex items-center gap-3 group">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                                <i data-lucide="zap" class="w-5 h-5 text-white"></i>
                            </div>
                            <div>
                                <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">night<span class="text-indigo-400">imagens</span></span>
                                <span class="block text-[10px] text-slate-400 font-medium uppercase tracking-widest">Ultra Fast Host</span>
                            </div>
                        </a>
                        <div class="flex items-center gap-3">
                            <a href="#/admin" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-medium transition-all border border-slate-700 flex items-center gap-2 shadow-sm">
                                <i data-lucide="shield-alert" class="w-4 h-4 text-indigo-400"></i>
                                Painel Admin
                            </a>
                        </div>
                    </div>
                </header>

                <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
                    <div class="text-center max-w-2xl mx-auto mb-12">
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold mb-4">
                            <i data-lucide="zap" class="w-3.5 h-3.5"></i> Resposta Instantânea & Alta Qualidade
                        </div>
                        <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight mb-4">
                            Hospedagem de Imagens <span class="bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">Ultrarrápida</span>
                        </h1>
                        <p class="text-slate-400 text-base sm:text-lg">
                            Visualize e compartilhe imagens em alta resolução com links diretos limpos e sem distrações.
                        </p>
                    </div>

                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-white flex items-center gap-2">
                            <i data-lucide="image" class="w-5 h-5 text-indigo-400"></i> Imagens Recentes
                        </h2>
                        <span class="text-xs text-slate-400 bg-slate-900 px-3 py-1 rounded-lg border border-slate-800">${images.length} hospedadas</span>
                    </div>

                    ${images.length === 0 ? `
                        <div class="text-center py-20 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                            <i data-lucide="folder-open" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
                            <h3 class="text-lg font-medium text-slate-300">Nenhuma imagem cadastrada</h3>
                            <p class="text-sm text-slate-500 mt-1">Acesse o painel admin para fazer o primeiro upload.</p>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                            ${images.map(img => `
                                <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl overflow-hidden group hover:border-indigo-500/40 transition-all shadow-xl flex flex-col">
                                    <div class="relative aspect-video bg-slate-950 overflow-hidden">
                                        <img src="${img.url}" alt="${img.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=Erro+na+Imagem'" />
                                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-3">
                                            <a href="${img.directUrl}" target="_blank" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 transition-all">
                                                <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Abrir Raw (Só a Imagem)
                                            </a>
                                        </div>
                                    </div>
                                    <div class="p-4 flex-1 flex flex-col justify-between">
                                        <div>
                                            <h3 class="font-semibold text-sm text-slate-200 truncate mb-1" title="${img.name}">${img.name}</h3>
                                            <div class="flex items-center justify-between text-xs text-slate-400">
                                                <span class="font-mono text-indigo-300 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/40">${img.id}</span>
                                                <span>${img.size || '1.2 MB'}</span>
                                            </div>
                                        </div>
                                        <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between">
                                            <button onclick="copyDirectLink('${img.id}')" class="text-xs text-slate-400 hover:text-indigo-400 flex items-center gap-1.5 transition-colors">
                                                <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copiar Link
                                            </button>
                                            <a href="#/${img.id}" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1">
                                                Ver na Página <i data-lucide="arrow-right" class="w-3 h-3"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </main>

                <footer class="border-t border-slate-800/80 bg-slate-900/40 py-6 mt-12 text-center text-xs text-slate-500">
                    <p>&copy; ${new Date().getFullYear()} nightimagens. Todos os direitos reservados.</p>
                </footer>
            `;
            lucide.createIcons();

            window.copyDirectLink = function(id) {
                const images = getImages();
                const img = images.find(item => item.id === id);
                if (!img) {
                    showNotification('Imagem não encontrada para copiar o link.', 'error');
                    return;
                }

                const fullUrl = img.directUrl || buildDirectImageUrl(img);
                const tempInput = document.createElement('input');
                tempInput.value = fullUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showNotification('Link direto copiado para a área de transferência!');
            };
        }

        // --- VIEW 3: ADMIN PANEL (LOGIN & UPLOAD/GRID) ---
        function renderAdminView() {
            const app = document.getElementById('app');
            const isLoggedIn = sessionStorage.getItem('night_admin_auth') === 'true';

            if (!isLoggedIn) {
                // Login screen
                app.innerHTML = `
                    <div class="flex-1 flex items-center justify-center p-4 bg-slate-950">
                        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
                            <div class="absolute -right-10 -top-10 w-40 h-40 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>
                            
                            <div class="text-center mb-8">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                                    <i data-lucide="lock" class="w-6 h-6 text-white"></i>
                                </div>
                                <h1 class="text-2xl font-bold text-white tracking-tight">Painel Administrativo</h1>
                                <p class="text-sm text-slate-400 mt-1">Insira suas credenciais para gerenciar o nightimagens</p>
                            </div>

                            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Usuário</label>
                                    <div class="relative">
                                        <i data-lucide="user" class="w-5 h-5 text-slate-500 absolute left-3.5 top-3"></i>
                                        <input type="text" id="username" required placeholder="Digite o usuário" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 pl-11 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm transition-colors" />
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Senha</label>
                                    <div class="relative">
                                        <i data-lucide="key" class="w-5 h-5 text-slate-500 absolute left-3.5 top-3"></i>
                                        <input type="password" id="password" required placeholder="Digite a senha" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 pl-11 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm transition-colors" />
                                    </div>
                                </div>
                                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 mt-2">
                                    <i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Painel
                                </button>
                            </form>

                            <div class="mt-6 text-center">
                                <a href="#/" class="text-xs text-slate-500 hover:text-slate-300 transition-colors inline-flex items-center gap-1.5">
                                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Voltar para a página inicial
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                lucide.createIcons();

                window.handleLogin = function(e) {
                    e.preventDefault();
                    const u = document.getElementById('username').value.trim();
                    const p = document.getElementById('password').value.trim();

                    // CREDENTIALS CHECK
                    if (u === 'Night' && p === '78203592') {
                        sessionStorage.setItem('night_admin_auth', 'true');
                        showNotification('Login efetuado com sucesso!');
                        renderAdminView();
                    } else {
                        showNotification('Usuário ou senha incorretos!', 'error');
                    }
                };
                return;
            }

            // Authenticated Admin Dashboard
            const images = getImages();
            app.innerHTML = `
                <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                                <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
                            </div>
                            <div>
                                <span class="font-bold text-lg tracking-tight text-white">Painel Admin</span>
                                <span class="block text-[10px] text-indigo-400 font-medium uppercase tracking-widest">nightimagens</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <a href="#/" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-medium transition-all border border-slate-700 flex items-center gap-2">
                                <i data-lucide="home" class="w-4 h-4 text-slate-400"></i> Ver Site
                            </a>
                            <button onclick="handleLogout()" class="px-4 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/20 rounded-xl text-sm font-medium transition-all flex items-center gap-2">
                                <i data-lucide="log-out" class="w-4 h-4"></i> Sair
                            </button>
                        </div>
                    </div>
                </header>

                <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">
                    <div class="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-2xl">
                        <div class="mb-6">
                            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                                <i data-lucide="upload-cloud" class="w-5 h-5 text-indigo-400"></i> Upload de Nova Imagem
                            </h2>
                            <p class="text-sm text-slate-400 mt-1">Envie arquivos via seletor ou arraste diretamente. Um ID aleatório exclusivo será gerado.</p>
                        </div>

                        <form id="upload-form" onsubmit="handleUpload(event)" class="space-y-4">
                            <div class="border-2 border-dashed border-slate-700 hover:border-indigo-500/60 rounded-2xl p-8 text-center bg-slate-950/40 transition-all cursor-pointer relative" onclick="document.getElementById('file-input').click()">
                                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="previewSelectedFile(this)" />
                                <div id="upload-dropzone-content">
                                    <div class="w-14 h-14 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 mx-auto mb-4">
                                        <i data-lucide="image-plus" class="w-7 h-7"></i>
                                    </div>
                                    <p class="text-sm font-medium text-slate-200">Clique aqui para selecionar uma imagem <span class="text-slate-400 font-normal">ou cole uma URL abaixo</span></p>
                                    <p class="text-xs text-slate-500 mt-1">PNG, JPG, WEBP, GIF suportados</p>
                                </div>
                                <div id="upload-preview-container" class="hidden flex flex-col items-center">
                                    <img id="preview-img-tag" src="" alt="Preview" class="max-h-48 rounded-xl object-contain mb-3 border border-slate-700 shadow-md" />
                                    <span id="preview-filename" class="text-sm text-indigo-300 font-medium"></span>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Nome / Título da Imagem</label>
                                    <input type="text" id="img-name" placeholder="Ex: Papel de parede abstrato" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm" />
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Ou URL Externa da Imagem</label>
                                    <input type="url" id="img-url-input" placeholder="https://exemplo.com/imagem.jpg" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm" />
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
                                <i data-lucide="upload" class="w-4 h-4"></i> Enviar Imagem Agora
                            </button>
                        </form>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                                <i data-lucide="grid" class="w-5 h-5 text-indigo-400"></i> Gerenciamento de Imagens (${images.length})
                            </h2>
                            <p class="text-xs text-slate-400">Apague ou acesse o link raw de cada imagem</p>
                        </div>

                        ${images.length === 0 ? `
                            <div class="text-center py-16 bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                                <i data-lucide="inbox" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
                                <p class="text-slate-400 text-sm">Nenhuma imagem enviada ainda.</p>
                            </div>
                        ` : `
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                ${images.map(img => `
                                    <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl flex flex-col group">
                                        <div class="relative aspect-video bg-slate-950 overflow-hidden">
                                            <img src="${img.url}" alt="${img.name}" loading="lazy" class="w-full h-full object-cover" />
                                            <div class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur-md px-2 py-1 rounded-lg text-xs font-mono text-indigo-300 border border-slate-800">
                                                ${img.id}
                                            </div>
                                        </div>
                                        <div class="p-4 flex-1 flex flex-col justify-between">
                                            <div>
                                                <h3 class="font-semibold text-sm text-slate-200 truncate mb-1" title="${img.name}">${img.name}</h3>
                                                <p class="text-xs text-slate-500">${new Date(img.uploadedAt).toLocaleDateString('pt-BR')}</p>
                                            </div>
                                            <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between gap-2">
                                                <a href="${img.directUrl}" target="_blank" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 transition-colors">
                                                    <i data-lucide="external-link" class="w-3.5 h-3.5 text-indigo-400"></i> Ver
                                                </a>
                                                <button onclick="deleteImage('${img.id}')" class="px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/20 rounded-xl text-xs font-medium flex items-center justify-center transition-colors" title="Excluir imagem">
                                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </main>
            `;
            lucide.createIcons();

            window.handleLogout = function() {
                sessionStorage.removeItem('night_admin_auth');
                showNotification('Sessão encerrada com sucesso.');
                renderAdminView();
            };

            window.previewSelectedFile = function(input) {
                if (input.files && input.files[0]) {
                    const file = input.files[0];
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById('upload-dropzone-content').classList.add('hidden');
                        const previewContainer = document.getElementById('upload-preview-container');
                        previewContainer.classList.remove('hidden');
                        document.getElementById('preview-img-tag').src = e.target.result;
                        document.getElementById('preview-filename').textContent = file.name;
                        
                        // Auto-fill name if empty
                        const nameInput = document.getElementById('img-name');
                        if (!nameInput.value) {
                            nameInput.value = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                        }
                        // Save base64 data temporarily in url input dataset or variable
                        document.getElementById('img-url-input').dataset.base64 = e.target.result;
                        // Calculate approximate size
                        const sizeMb = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                        document.getElementById('img-url-input').dataset.size = sizeMb;
                    };
                    reader.readAsDataURL(file);
                }
            };

            window.handleUpload = function(e) {
                e.preventDefault();
                const nameInput = document.getElementById('img-name').value.trim() || 'Imagem Sem Título';
                const urlInput = document.getElementById('img-url-input');
                const base64Data = urlInput.dataset.base64;
                const directUrl = urlInput.value.trim();

                const finalUrl = directUrl || base64Data;
                if (!finalUrl) {
                    showNotification('Selecione um arquivo ou insira uma URL de imagem válida!', 'error');
                    return;
                }

                const newId = generateId();
                const size = urlInput.dataset.size || '1.5 MB';

                const newImage = {
                    id: newId,
                    url: finalUrl,
                    directUrl: buildDirectImageUrl({ id: newId, url: finalUrl }),
                    name: nameInput,
                    size: size,
                    uploadedAt: new Date().toISOString()
                };

                const images = getImages();
                images.unshift(newImage);
                saveImages(images);

                showNotification(`Imagem enviada com sucesso! ID: ${newId}`);
                renderAdminView();
            };

            window.deleteImage = function(id) {
                if (confirm('Tem certeza que deseja apagar esta imagem?')) {
                    let images = getImages();
                    images = images.filter(img => img.id !== id);
                    saveImages(images);
                    showNotification('Imagem removida com sucesso.');
                    renderAdminView();
                }
            };
        }

        // Initialize router on load
        window.addEventListener('DOMContentLoaded', handleRoute);
    </script>
</body>
</html>
