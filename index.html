<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nightimagens - Hospedagem Rápida de Imagens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col selection:bg-indigo-500 selection:text-white">

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <script>
        const STORAGE_KEY = 'nightimagens_db_v2';
        
        const defaultImages = [
            {
                id: 'n8x9q2',
                url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop',
                name: 'Abstrato Cósmico Neon',
                size: '1.4 MB',
                uploadedAt: new Date(Date.now() - 3600000 * 2).toISOString()
            }
        ];

        function getImages() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (!data) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultImages));
                    return defaultImages;
                }
                return JSON.parse(data);
            } catch (e) {
                return defaultImages;
            }
        }

        function saveImages(images) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
        }

        function generateId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let res = '';
            for (let i = 0; i < 6; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        function showNotification(message, type = 'success') {
            const existing = document.getElementById('toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            toast.className = `fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium border backdrop-blur-md transition-all transform translate-y-2 opacity-0 animate-fade-in ${
                type === 'success' 
                    ? 'bg-emerald-950/80 border-emerald-500/30 text-emerald-200' 
                    : 'bg-rose-950/80 border-rose-500/30 text-rose-200'
            }`;
            
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-5 h-5 flex-shrink-0"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function handleRoute() {
            const path = window.location.pathname;
            const hash = window.location.hash;
            const cleanPath = path === '/' ? (hash.startsWith('#/') ? hash.replace('#/', '') : '') : path.replace('/', '');
            
            if (cleanPath && cleanPath !== 'admin' && cleanPath !== '') {
                renderDirectImageView(cleanPath);
            } else if (cleanPath === 'admin' || hash === '#/admin') {
                renderAdminView();
            } else {
                renderHomeView();
            }
        }

        window.addEventListener('popstate', handleRoute);
        window.addEventListener('hashchange', handleRoute);

        function renderDirectImageView(id) {
            const images = getImages();
            const img = images.find(item => item.id === id);
            const app = document.getElementById('app');
            
            if (!img) {
                app.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center bg-slate-950">
                        <div class="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 mb-4">
                            <i data-lucide="image-off" class="w-8 h-8"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-slate-100 mb-2">Imagem não encontrada</h1>
                        <p class="text-slate-400 max-w-md mb-6">A imagem solicitada com ID <code class="bg-slate-900 px-2 py-1 rounded text-rose-300 font-mono">${id}</code> não existe ou foi removida.</p>
                        <a href="#/" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center gap-2">
                            <i data-lucide="home" class="w-4 h-4"></i> Voltar ao Início
                        </a>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Apenas a imagem pura e mais nada
            app.innerHTML = `
                <div class="fixed inset-0 bg-black flex items-center justify-center overflow-hidden m-0 p-0">
                    <img src="${img.url}" alt="${img.name}" class="max-w-full max-h-full object-contain select-none cursor-zoom-in" id="raw-img" onclick="toggleZoom()" />
                </div>
            `;
            
            window.toggleZoom = function() {
                const el = document.getElementById('raw-img');
                if (el.classList.contains('scale-150')) {
                    el.classList.remove('scale-150', 'cursor-zoom-out');
                    el.classList.add('cursor-zoom-in');
                } else {
                    el.classList.add('scale-150', 'cursor-zoom-out');
                    el.classList.remove('cursor-zoom-in');
                }
            };
            lucide.createIcons();
        }

        function renderHomeView() {
            const images = getImages();
            const app = document.getElementById('app');

            app.innerHTML = `
                <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <a href="#/" class="flex items-center gap-3 group">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                                <i data-lucide="zap" class="w-5 h-5 text-white"></i>
                            </div>
                            <div>
                                <span class="font-bold text-lg tracking-tight text-white">night<span class="text-indigo-400">imagens</span></span>
                                <span class="block text-[10px] text-slate-400 font-medium uppercase tracking-widest">Ultra Fast Host</span>
                            </div>
                        </a>
                        <a href="#/admin" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-medium transition-all border border-slate-700 flex items-center gap-2">
                            <i data-lucide="shield-alert" class="w-4 h-4 text-indigo-400"></i> Painel Admin
                        </a>
                    </div>
                </header>

                <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
                    <div class="text-center max-w-2xl mx-auto mb-12">
                        <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight mb-4">
                            Hospedagem de Imagens <span class="bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">Ultrarrápida</span>
                        </h1>
                        <p class="text-slate-400 text-base">Compatível com CurseForge, Discord e fóruns.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        ${images.map(img => `
                            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl overflow-hidden group shadow-xl flex flex-col">
                                <div class="relative aspect-video bg-slate-950 overflow-hidden">
                                    <img src="${img.url}" alt="${img.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                </div>
                                <div class="p-4 flex-1 flex flex-col justify-between">
                                    <div>
                                        <h3 class="font-semibold text-sm text-slate-200 truncate mb-1">${img.name}</h3>
                                        <span class="font-mono text-xs text-indigo-300 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/40">${img.id}</span>
                                    </div>
                                    <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between">
                                        <button onclick="navigator.clipboard.writeText('${img.url}'); showNotification('Link direto copiado!');" class="text-xs text-slate-400 hover:text-indigo-400 flex items-center gap-1.5">
                                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copiar Link CurseForge
                                        </button>
                                        <a href="#/${img.id}" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300">Ver</a>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </main>
            `;
            lucide.createIcons();
        }

        function renderAdminView() {
            const app = document.getElementById('app');
            const isLoggedIn = sessionStorage.getItem('night_admin_auth') === 'true';

            if (!isLoggedIn) {
                app.innerHTML = `
                    <div class="flex-1 flex items-center justify-center p-4 bg-slate-950">
                        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
                            <div class="text-center mb-8">
                                <h1 class="text-2xl font-bold text-white">Painel Administrativo</h1>
                                <p class="text-sm text-slate-400 mt-1">Night / 78203592</p>
                            </div>
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Usuário</label>
                                    <input type="text" id="username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm" />
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Senha</label>
                                    <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm" />
                                </div>
                                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg transition-all">Entrar</button>
                            </form>
                            <div class="mt-6 text-center">
                                <a href="#/" class="text-xs text-slate-500 hover:text-slate-300">Voltar ao Início</a>
                            </div>
                        </div>
                    </div>
                `;
                lucide.createIcons();

                window.handleLogin = function(e) {
                    e.preventDefault();
                    if (document.getElementById('username').value.trim() === 'Night' && document.getElementById('password').value.trim() === '78203592') {
                        sessionStorage.setItem('night_admin_auth', 'true');
                        showNotification('Login efetuado com sucesso!');
                        renderAdminView();
                    } else {
                        showNotification('Credenciais inválidas!', 'error');
                    }
                };
                return;
            }

            const images = getImages();
            app.innerHTML = `
                <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                        <span class="font-bold text-white">Painel Admin - nightimagens</span>
                        <div class="flex gap-3">
                            <a href="#/" class="px-4 py-2 bg-slate-800 text-slate-200 rounded-xl text-sm">Ver Site</a>
                            <button onclick="sessionStorage.removeItem('night_admin_auth'); renderAdminView();" class="px-4 py-2 bg-rose-500/10 text-rose-300 rounded-xl text-sm">Sair</button>
                        </div>
                    </div>
                </header>

                <main class="max-w-7xl mx-auto px-4 py-10 space-y-10">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
                        <h2 class="text-xl font-bold text-white mb-4">Upload de Imagem (Pronto para CurseForge)</h2>
                        <form onsubmit="handleUpload(event)" class="space-y-4">
                            <input type="file" id="file-input" accept="image/*" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" />
                            <input type="text" id="img-name" placeholder="Nome da imagem (opcional)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 text-sm" />
                            <button type="submit" id="upload-btn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg transition-all">Enviar para Nuvem Pública</button>
                        </form>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                        ${images.map(img => `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col">
                                <div class="aspect-video bg-slate-950 relative">
                                    <img src="${img.url}" class="w-full h-full object-cover" />
                                </div>
                                <div class="p-4 flex-1 flex flex-col justify-between">
                                    <h3 class="font-semibold text-sm text-slate-200 truncate">${img.name}</h3>
                                    <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
                                        <button onclick="navigator.clipboard.writeText('${img.url}'); showNotification('Link copiado!');" class="text-xs text-indigo-400 hover:underline">Copiar Link Direto</button>
                                        <button onclick="deleteImage('${img.id}')" class="text-xs text-rose-400">Apagar</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </main>
            `;
            lucide.createIcons();

            window.handleUpload = async function(e) {
                e.preventDefault();
                const fileInput = document.getElementById('file-input');
                const file = fileInput.files[0];
                if (!file) return;

                const btn = document.getElementById('upload-btn');
                btn.textContent = 'Enviando para a nuvem...';
                btn.disabled = true;

                try {
                    const formData = new FormData();
                    formData.append('reqtype', 'fileupload');
                    formData.append('fileToUpload', file);

                    const response = await fetch('https://catbox.moe/user/api.php', {
                        method: 'POST',
                        body: formData
                    });

                    const directUrl = await response.text();
                    if (!directUrl.startsWith('http')) {
                        throw new Error('Falha no upload.');
                    }

                    const nameInput = document.getElementById('img-name').value.trim() || file.name;
                    const newImage = {
                        id: generateId(),
                        url: directUrl.trim(),
                        name: nameInput,
                        uploadedAt: new Date().toISOString()
                    };

                    const images = getImages();
                    images.unshift(newImage);
                    saveImages(images);

                    showNotification('Upload concluído! Link pronto para o CurseForge.');
                    renderAdminView();
                } catch (err) {
                    showNotification('Erro ao enviar imagem.', 'error');
                    btn.textContent = 'Enviar para Nuvem Pública';
                    btn.disabled = false;
                }
            };

            window.deleteImage = function(id) {
                if (confirm('Deseja apagar esta imagem?')) {
                    let images = getImages();
                    images = images.filter(img => img.id !== id);
                    saveImages(images);
                    showNotification('Removido com sucesso.');
                    renderAdminView();
                }
            };
        }

        window.addEventListener('DOMContentLoaded', handleRoute);
    </script>
</body>
</html>
